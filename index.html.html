<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>오늘 뭐 보지? - 랜덤 영화 추천</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }
        body {
            background-color: #0f0f12;
            color: #ffffff;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
            padding: 20px;
        }

        header {
            text-align: center;
            margin-bottom: 40px;
        }
        h1 {
            color: #ff3366;
            font-size: 2.5rem;
            margin-bottom: 10px;
            text-shadow: 0 0 10px rgba(255, 51, 102, 0.3);
        }
        p {
            color: #aaa;
        }

        .random-btn {
            padding: 15px 40px;
            background: linear-gradient(135deg, #ff3366, #ff6633);
            color: white;
            border: none;
            border-radius: 50px;
            font-size: 1.2rem;
            font-weight: bold;
            cursor: pointer;
            box-shadow: 0 4px 15px rgba(255, 51, 102, 0.4);
            transition: all 0.3s ease;
            margin-bottom: 40px;
        }
        .random-btn:hover {
            transform: scale(1.05);
            box-shadow: 0 6px 20px rgba(255, 51, 102, 0.6);
        }

        .movie-card {
            background-color: #1a1a24;
            border-radius: 16px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.5);
            max-width: 400px;
            width: 100%;
            overflow: hidden;
            display: none;
            animation: fadeIn 0.5s ease-in-out;
        }
        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(20px); }
            to { opacity: 1; transform: translateY(0); }
        }

        .movie-poster {
            width: 100%;
            height: 450px;
            object-fit: cover;
            background-color: #252533;
        }
        .movie-info {
            padding: 25px;
        }
        .movie-title {
            font-size: 1.5rem;
            margin-bottom: 10px;
            font-weight: bold;
        }
        .movie-meta {
            display: flex;
            justify-content: space-between;
            margin-bottom: 15px;
            font-size: 0.95rem;
            color: #aaa;
        }
        .rating {
            color: #ffb400;
            font-weight: bold;
        }
        .movie-overview {
            font-size: 0.9rem;
            color: #ccc;
            line-height: 1.6;
            display: -webkit-box;
            -webkit-line-clamp: 4;
            -webkit-box-orient: vertical;
            overflow: hidden;
        }

        .loader {
            display: none;
            border: 4px solid #f3f3f3;
            border-top: 4px solid #ff3366;
            border-radius: 50%;
            width: 40px;
            height: 40px;
            animation: spin 1s linear infinite;
            margin-bottom: 20px;
        }
        @keyframes spin {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }
    </style>
</head>
<body>

    <header>
        <h1>🎬 오늘 뭐 보지?</h1>
        <p>결정장애 치료소. 버튼을 누르면 무작위로 영화를 골라드려요!</p>
    </header>

    <button class="random-btn" onclick="getRandomMovie()">랜덤 영화 추천받기 🎲</button>

    <div class="loader" id="loader"></div>

    <div class="movie-card" id="movieCard">
        <img src="" alt="영화 포스터" class="movie-poster" id="moviePoster">
        <div class="movie-info">
            <h2 class="movie-title" id="movieTitle">영화 제목</h2>
            <div class="movie-meta">
                <span id="movieDate">개봉일</span>
                <span class="rating" id="movieRating">★ 평점</span>
            </div>
            <p class="movie-overview" id="movieOverview">영화 줄거리 내용이 여기에 들어갑니다.</p>
        </div>
    </div>

    <script>
        // 발급받으신 진짜 API 키가 완벽하게 적용된 함수입니다!
        async function getRandomMovie() {
            const loader = document.getElementById('loader');
            const movieCard = document.getElementById('movieCard');
            
            loader.style.display = 'block';
            movieCard.style.display = 'none';

            try {
                // 1~5페이지 중 랜덤 선택
                const randomPage = Math.floor(Math.random() * 5) + 1;
                
                // 회원님의 API 키(a9432e1f0555fd80fef549b63d3114af)를 주소에 바로 넣었습니다.
                const response = await fetch(`https://api.themoviedb.org/3/movie/popular?api_key=a9432e1f0555fd80fef549b63d3114af&language=ko-KR&page=${randomPage}`);
                const data = await response.json();
                
                const movies = data.results;
                const randomIndex = Math.floor(Math.random() * movies.length);
                const selectedMovie = movies[randomIndex];

                // 화면에 데이터 매핑
                document.getElementById('movieTitle').innerText = selectedMovie.title;
                document.getElementById('movieDate').innerText = `개봉: ${selectedMovie.release_date || '정보 없음'}`;
                document.getElementById('movieRating').innerText = `★ ${selectedMovie.vote_average.toFixed(1)}`;
                document.getElementById('movieOverview').innerText = selectedMovie.overview || "이 영화는 등록된 줄거리 요약이 없습니다.";
                
                if(selectedMovie.poster_path) {
                    document.getElementById('moviePoster').src = `https://image.tmdb.org/t/p/w500${selectedMovie.poster_path}`;
                } else {
                    document.getElementById('moviePoster').src = `https://images.unsplash.com/photo-1594909122845-11baa439b7bf?w=400`;
                }

                loader.style.display = 'none';
                movieCard.style.display = 'block';

            } catch (error) {
                console.error("오류 발생:", error);
                alert("영화 데이터를 불러오지 못했습니다. 다시 시도해주세요!");
                loader.style.display = 'none';
            }
        }

        // 처음 켰을 때 자동 실행
        getRandomMovie();
    </script>
</body>
</html>
